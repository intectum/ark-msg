[package]
name = "ark_msg"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "ark_msg"
path = "src/lib.rs"

[[bin]]
name = "ark-msg"
path = "src/main.rs"

[dependencies]
ark = { path = "../ark" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
